<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Ashish Kumar — animated XR, AI and Mobile Engineering banner">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0d18"/><stop offset="1" stop-color="#202b50"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#6366f1" stop-opacity=".25"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<linearGradient id="fade"><stop stop-color="#0b0d18" stop-opacity=".7"/><stop offset=".68" stop-color="#0b0d18" stop-opacity=".55"/><stop offset="1" stop-color="#0b0d18" stop-opacity="0"/></linearGradient>
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#818cf8" stop-opacity="0"/><stop offset=".4" stop-color="#818cf8" stop-opacity=".19"/><stop offset=".7" stop-color="#38bdf8" stop-opacity=".12"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></linearGradient><linearGradient id="meteor"><stop stop-color="#7dd3fc" stop-opacity="0"/><stop offset="1" stop-color="#e0f2fe" stop-opacity=".9"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-opacity=".065"/></pattern>
<clipPath id="clip"><rect width="1200" height="440" rx="22"/></clipPath>
</defs>
<style>
.star{animation:twinkle 6s ease-in-out infinite}.star-1{animation-duration:8s}.star-2{animation-duration:10s}
.orbit{transform-origin:1000px 148px;animation:orbit 44s linear infinite}
.orbit-inner{transform-origin:1000px 148px;animation:orbit 32s linear infinite reverse}
.mesh{animation:float 12s ease-in-out infinite}.glow{animation:breathe 10s ease-in-out infinite}
.signal{stroke-dasharray:80 460;animation:signal 12s linear infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes signal{to{stroke-dashoffset:-540}}
@media(prefers-reduced-motion:reduce){.star,.orbit,.orbit-inner,.mesh,.glow,.signal{animation:none}}
.xr-hud{animation:hud 5s ease-in-out infinite}.ai-node{animation:node 3s ease-in-out infinite}.ml-line{stroke-dasharray:300;stroke-dashoffset:300;animation:learn 7s ease-in-out infinite}.cv-scan{animation:scan 4s ease-in-out infinite}.cv-target{animation:target 4s ease-in-out infinite}
@keyframes hud{0%,100%{opacity:.45;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes node{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes learn{0%{stroke-dashoffset:300}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:300}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(52px);opacity:1}}
@keyframes target{0%,25%,100%{opacity:.3}45%,80%{opacity:1}}
@media(prefers-reduced-motion:reduce){.xr-hud,.ai-node,.ml-line,.cv-scan,.cv-target{animation:none}.ml-line{stroke-dashoffset:0}}
.aurora{animation:aurora 18s ease-in-out infinite alternate}.aurora-second{animation:aurora 23s ease-in-out infinite alternate-reverse}.spatial-grid{animation:grid-flow 24s linear infinite}.meteor{opacity:0;animation:meteor 12s linear infinite}.meteor-second{animation-delay:5s;animation-duration:15s}
@keyframes aurora{0%{transform:translate(-90px,-30px) rotate(-4deg);opacity:.45}100%{transform:translate(100px,35px) rotate(5deg);opacity:1}}
@keyframes grid-flow{to{transform:translate(48px,48px)}}
@keyframes meteor{0%,65%{opacity:0;transform:translate(0,0)}67%{opacity:.8}78%{opacity:0;transform:translate(450px,140px)}100%{opacity:0;transform:translate(450px,140px)}}
@media(prefers-reduced-motion:reduce){.aurora,.aurora-second,.spatial-grid,.meteor{animation:none}.meteor{opacity:0}}
</style>
<g clip-path="url(#clip)">
